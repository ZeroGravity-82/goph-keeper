services:
  postgresql-test:
    image: postgres:15
    ports:
      - '15432:5432'
    environment:
      - POSTGRES_DB=gophkeeper_test
      - POSTGRES_USER=gophkeeper
      - POSTGRES_PASSWORD=userpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper -d gophkeeper_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  minio-test:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - '19000:9000'
      - '19001:9001'
    environment:
      - MINIO_ROOT_USER=gophkeeper
      - MINIO_ROOT_PASSWORD=userpassword
    tmpfs:
      - /data
