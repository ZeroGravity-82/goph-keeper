services:
  postgresql:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=gophkeeper
      - POSTGRES_USER=gophkeeper
      - POSTGRES_PASSWORD=userpassword
    volumes:
      - postgresql:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper -d gophkeeper"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # Порт для API (S3)
      - '9001:9001' # Порт для веб-консоли управления
    environment:
      - MINIO_ROOT_USER=gophkeeper
      - MINIO_ROOT_PASSWORD=gophkeeperpassword
    volumes:
      - minio:/data:rw
volumes:
  postgresql:
  minio:
