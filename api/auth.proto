edition = "2023";

package gophkeeper.v1;

option go_package = "zerogravity-82/goph-keeper/internal/pb;pb";

message RegisterRequest {
  string login = 1;
  string password = 2;
  bytes master_key_salt = 3;
  bytes master_key_verifier = 4;
}

message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  bytes master_key_salt = 3;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  bytes master_key_salt = 3;
  bytes master_key_verifier = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ReencryptedRecordDEK {
  string record_id = 1;
  int64 expected_version = 2;
  bytes encrypted_dek = 3;
}

message ChangeMasterKeyRequest {
  bytes master_key_salt = 1;
  bytes master_key_verifier = 2;
  repeated ReencryptedRecordDEK records = 3;
}

message ChangeMasterKeyResponse {}

service Auth {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ChangeMasterKey(ChangeMasterKeyRequest) returns (ChangeMasterKeyResponse);
}
